name: Flutter Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.7.2'  # Ensure the exact version you want
        cache: true  # Optional: Enables caching to speed up the setup

    - name: Verify Flutter and Dart version
      run: |
        flutter --version  # Verify the version
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH  # Add Flutter tools to PATH

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter web app
      run: flutter build web

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: ${{ secrets.FIREBASE_PROJECT_ID }}