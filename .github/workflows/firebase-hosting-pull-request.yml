name: Flutter Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'  # Updated to a version with Dart 3.13.0 or higher
        cache: true

    - name: Verify Flutter and Dart version
      run: |
        flutter --version
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
        echo "/opt/hostedtoolcache/flutter/stable-3.16.0-x64/bin" >> $GITHUB_PATH  # Update path to match new version

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter web app
      run: flutter build web

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: ${{ secrets.FIREBASE_PROJECT_ID }}